# ============================================================================
# Office documents for KIRA – Word, Excel, PowerPoint and e-mail drafts on request, handed out as download links
# included by /opt/office/docker-compose.yml; versions from env/versions.env, secrets from env/*.env (setup.sh)
#
#   office-mcp    MCP server mcp-ms-office-documents (MIT): LibreChat calls its tools, it builds the file and
#                 uploads it to office-files; the answer contains a signed link (valid OFFICE_LINK_HOURS)
#   office-files  kira-files (files/kira_files.py, standard library only): keeps the files, checks the signature
#                 of every link and deletes the files after OFFICE_LINK_HOURS
#
# Network: kira-office (internal, 172.30.28.0/24, created by setup.sh) – no internet.
#   LibreChat -> office-mcp (tools) · Caddy (fixed .2) -> office-files (downloads under /kira-files/)
#   office-mcp uploads to https://<KIRA domain>, which points to Caddy here (extra_hosts) – so the link is signed
#   for the public address and works in the user's browser.
# Own templates: /opt/office/templates (files) and /opt/office/config (YAML) – README, section "Office documents".
# ============================================================================

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  office-mcp:
    <<: *hardening
    container_name: office-mcp
    hostname: office-mcp
    image: georgx22/mcp-office-docs:${OFFICE_MCP_TAG:?set in env/versions.env}
    env_file: [/opt/office/env/office-mcp.env]
    environment:
      UPLOAD_STRATEGY: MINIO              # S3 protocol – office-files speaks the part of it that is needed
      MINIO_BUCKET: kira-files
      MINIO_REGION: us-east-1
      MINIO_PATH_STYLE: "true"
      MINIO_VERIFY_SSL: "true"
      EMAIL_DEFAULT_LANGUAGE: de
    extra_hosts:
      - "${KIRA_DOMAIN:?set by /opt/kira/setup.sh in env/versions.env}:172.30.28.2"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/output
    volumes:
      - /opt/office/templates:/app/custom_templates:ro
      - /opt/office/config:/app/config:ro
    pids_limit: 256
    mem_limit: 1g
    networks: [kira-office]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8958/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  office-files:
    <<: *hardening
    container_name: office-files
    hostname: office-files
    image: python:${PYTHON_TAG:?set in env/versions.env}
    command: ["python", "-u", "/app/kira_files.py"]
    env_file: [/opt/office/env/office-files.env]
    environment:
      BUCKET: kira-files
      DATA_DIR: /data
      PORT: "8080"
      MAX_MB: "50"                        # Caddy accepts at most 50 MB per request (kira.caddy)
      RUN_AS_UID: "10001"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]      # only to own the volume, then it continues as UID 10001
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - /opt/office/files/kira_files.py:/app/kira_files.py:ro
      - files:/data
    pids_limit: 64
    mem_limit: 256m
    networks: [kira-office]
    healthcheck:
      test: ["CMD", "python", "/app/kira_files.py", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  kira-office:
    external: true            # 172.30.28.0/24, created by /opt/kira/setup.sh

volumes:
  files:
