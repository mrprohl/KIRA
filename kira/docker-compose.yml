# ============================================================================
# kira – paste this file into Portainer (stack name kira, no environment variables)
#   or via CLI:  docker compose -f /opt/kira/docker-compose.yml up -d
# Definition: /opt/kira/compose.yml · versions: env/versions.env · Keycloak address: env/compose.env (setup.sh)
# Requires Docker Compose ≥ 2.20 (include with env_file) and read access to /opt.
# ============================================================================
name: kira

include:
  - path: /opt/kira/compose.yml
    env_file:
      - /opt/kira/env/versions.env
      - /opt/kira/env/compose.env
