<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>KIRA networks</title>
<desc>Internet to Caddy; Caddy via kira-proxy to LibreChat, Bifrost and Onyx nginx; LibreChat via kira-llm to Bifrost, via kira-search to web search and via kira-onyx to the Onyx MCP server and via kira-code to the optional code interpreter (no internet); with the optional privacy guard Bifrost reaches the vLLM servers in the LAN (exact ip:port only).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#ffffff"/>
<g font-size="14" font-weight="600" text-anchor="middle">
<rect x="260" y="20" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340" y="45" fill="#444441">Internet</text>
<rect x="240" y="100" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340" y="123" fill="#085041">Caddy</text>
<rect x="40" y="230" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="120" y="253" fill="#085041">LibreChat</text>
<rect x="260" y="230" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340" y="253" fill="#085041">Bifrost</text>
<rect x="480" y="230" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="560" y="253" fill="#3C3489">Onyx (nginx)</text>
<rect x="40" y="360" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="120" y="383" fill="#085041">Web search</text>
<rect x="480" y="416" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="560" y="439" fill="#3C3489">Onyx MCP</text>
<rect x="40" y="456" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/><text x="120" y="479" fill="#3C3489">Code interpreter</text>
<rect x="260" y="360" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="4 3"/><text x="340" y="383" fill="#633806">vLLM servers</text>
</g>
<g font-size="12" text-anchor="middle">
<text x="340" y="143" fill="#0F6E56">ports 80/443 · kira-edge</text>
<text x="120" y="273" fill="#0F6E56">out: Keycloak only</text>
<text x="340" y="273" fill="#0F6E56">out: AI providers</text>
<text x="560" y="273" fill="#534AB7">no internet</text>
<text x="120" y="403" fill="#0F6E56">SearXNG, Firecrawl</text>
<text x="560" y="459" fill="#534AB7">no internet</text>
<text x="120" y="499" fill="#534AB7">KVM sandbox, no internet</text>
<text x="340" y="403" fill="#854F0B">LAN, optional</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)">
