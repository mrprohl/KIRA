<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>KIRA groups</title>
<desc>Agent group gives the fixed agents; kira-builder and at least one kira-model group together give the agent builder with exactly those models; kira-admins gives everything.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="430" fill="#ffffff"/>
<g font-size="12" fill="#5F5E5A">
<text x="40" y="26">Keycloak group of the user</text>
<text x="420" y="26">What the user gets in KIRA</text>
</g>
<g font-size="14" font-weight="600" text-anchor="middle">
<rect x="40" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="140" y="63" fill="#3C3489">kira-users-*</text>
<rect x="420" y="40" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="530" y="63" fill="#085041">Fixed agents</text>
<rect x="40" y="140" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="140" y="163" fill="#3C3489">kira-builder</text>
<rect x="40" y="226" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="140" y="249" fill="#3C3489">kira-model-*</text>
<circle cx="320" cy="211" r="26" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="320" y="216" fill="#444441">and</text>
<rect x="420" y="183" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="530" y="206" fill="#085041">Agent builder</text>
<rect x="40" y="326" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="140" y="349" fill="#3C3489">kira-admins</text>
<rect x="420" y="326" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="530" y="349" fill="#085041">Everything</text>
</g>
<g font-size="12" text-anchor="middle">
<text x="140" y="83" fill="#534AB7">usually one per user</text>
<text x="530" y="83" fill="#0F6E56">as listed in groups.env</text>
<text x="140" y="183" fill="#534AB7">may build: yes / no</text>
<text x="140" y="269" fill="#534AB7">which models (add up)</text>
<text x="530" y="226" fill="#0F6E56">only those models</text>
<text x="140" y="369" fill="#534AB7">admin group</text>
<text x="530" y="369" fill="#0F6E56">all agents, models, params</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)">
<line x1="240" y1="68" x2="416" y2="68"/>
<path d="M240 168 L270 168 L270 200 L292 200"/>
<path d="M240 254 L270 254 L270 222 L292 222"/>
<line x1="346" y1="211" x2="416" y2="211"/>
<line x1="240" y1="354" x2="416" y2="354"/>
</g>
<text x="40" y="414" font-size="12" fill="#444441">kira-builder and kira-model-* are additional groups; one of them alone gives no agent builder.</text>
</svg>
