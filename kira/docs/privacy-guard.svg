<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>KIRA privacy guard</title>
<desc>LibreChat sends every request to Bifrost. The privacy-guard plugin asks the privacy checker and the safety checker on vLLM in parallel, then decides: refuse harmful requests, answer requests with personal or secret data with the local answer model, send clean requests to Claude or OpenAI. Embeddings always go to the local embedding model.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#ffffff"/>
<rect x="40" y="88" width="600" height="252" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<g font-size="14" font-weight="600" text-anchor="middle">
<rect x="250" y="20" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340" y="47" fill="#444441">LibreChat</text>
<text x="340" y="110" fill="#3C3489">Bifrost + privacy-guard plugin</text>
<rect x="70" y="140" width="250" height="56" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/><text x="195" y="163" fill="#3C3489">Privacy checker</text>
<rect x="360" y="140" width="250" height="56" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/><text x="485" y="163" fill="#3C3489">Safety checker</text>
<rect x="190" y="240" width="300" height="56" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/><text x="340" y="263" fill="#3C3489">Decision</text>
<rect x="40" y="380" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/><text x="130" y="403" fill="#791F1F">Refusal</text>
<rect x="250" y="380" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340" y="403" fill="#712B13">Local answer</text>
<rect x="460" y="380" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="550" y="403" fill="#085041">Claude / OpenAI</text>
</g>
<g font-size="12" text-anchor="middle">
<text x="195" y="183" fill="#534AB7">Qwen3.5-4B · personal/secret data</text>
<text x="485" y="183" fill="#534AB7">Qwen3Guard-Gen-4B · harmful</text>
<text x="340" y="283" fill="#534AB7">refuse › local › external</text>
<text x="130" y="423" fill="#A32D2D">harmful request</text>
<text x="340" y="423" fill="#993C1D">Qwen3.5-35B-A3B + notice</text>
<text x="550" y="423" fill="#0F6E56">clean request (internet)</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)">
<line x1="340" y1="64" x2="340" y2="96"/>
<path d="M300 118 L195 118 L195 136"/>
<path d="M380 118 L485 118 L485 136"/>
<path d="M195 196 L195 218 L300 218 L300 236"/>
<path d="M485 196 L485 218 L380 218 L380 236"/>
<path d="M230 296 L230 356 L130 356 L130 376"/>
<line x1="340" y1="296" x2="340" y2="376"/>
<path d="M450 296 L450 356 L550 356 L550 376"/>
</g>
<g font-size="12" fill="#444441">
<rect x="40" y="462" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="487" text-anchor="middle">Embeddings (document search): always Qwen3-Embedding on vLLM – documents never leave</text>
<text x="40" y="528">The models run with vLLM on separate GPU servers (one instance each); Bifrost reaches only these addresses.</text>
</g>
</svg>
