# ============================================================================
# Caddy – reverse proxy for KIRA (LibreChat), Onyx and Bifrost; included by /opt/caddy/docker-compose.yml
#
#   /opt/caddy/config            -> /etc/caddy (ro)   Caddyfile (generated by /opt/kira/setup.sh) + sites/*.caddy
#   volume caddy_data            -> /data/caddy       certificates and ACME account (persistent)
#   /config, /data, /tmp         -> tmpfs             auto-generated configuration, occupies the image VOLUME
# Networks: default (kira-edge)  internet (certificates, ports 80/443), fixed subnet 172.31.60.0/24 – the LAN block
#                                (/opt/kira/scripts/egress-firewall.sh) blocks LAN and host from it
#           kira-proxy           internal, 172.30.20.0/24, Caddy fixed at .2 – the only way to LibreChat, Bifrost, Onyx
#           kira-office          internal, 172.30.28.0/24, Caddy fixed at .2 – download links of the office documents
# Reload after changes:  docker exec caddy caddy reload --config /etc/caddy/Caddyfile
# ============================================================================

services:
  caddy:
    container_name: caddy
    hostname: caddy
    image: caddy:${CADDY_TAG:?set in env/versions.env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data:size=1m            # occupies the image VOLUME /data; content lives in the volume /data/caddy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # ports 80/443 (file capability of the Caddy binary)
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    networks:
      default: {}
      kira-proxy: { ipv4_address: 172.30.20.2 }
      kira-office: { ipv4_address: 172.30.28.2 }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"            # HTTP/3
      - "127.0.0.1:8080:8081"    # Bifrost web interface local only – access via SSH tunnel (README)
    volumes:
      - /opt/caddy/config:/etc/caddy:ro
      - data:/data/caddy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  default:
    name: kira-edge
    ipam: { config: [{ subnet: 172.31.60.0/24 }] }   # source of the LAN block – do not change
  kira-proxy:
    external: true            # 172.30.20.0/24, created by /opt/kira/setup.sh
  kira-office:
    external: true            # 172.30.28.0/24, created by /opt/kira/setup.sh (office documents, optional)

volumes:
  data:
