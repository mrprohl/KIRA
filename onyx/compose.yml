# ============================================================================
# Onyx Community Edition – intranet search (SharePoint and more) for the KIRA agent "Intranet" (optional)
# included by /opt/onyx/docker-compose.yml; versions from env/versions.env, Keycloak address from env/compose.env,
# secrets from /opt/onyx/env/onyx.env (setup.sh). Based on the official docker-compose.yml of Onyx v5.1.3,
# reduced: no own port (access via Caddy), no code interpreter (would need the Docker socket),
# file storage in PostgreSQL instead of a separate object store.
#
#   api_server               API, login, admin area (via nginx)
#   background               background services: connectors (SharePoint), indexing
#   web_server               web interface (Next.js)
#   mcp_server               MCP interface for LibreChat (agent "Intranet"), port 8090 internal only
#   inference_model_server / indexing_model_server   local embedding models (downloaded from Hugging Face on first start)
#   relational_db            PostgreSQL of Onyx (incl. uploaded files)
#   opensearch               search index
#   cache                    Redis
#   nginx                    internal routing /api, /mcp, web interface – Caddy only talks to nginx
#
# Networks:
#   onyx-outbound 172.31.64.0/24  internet (connectors, Hugging Face) – LAN/host blocked except Keycloak:443
#   kira-proxy / kira-llm / kira-onyx   internal, created externally (setup.sh)
#   backend                         internal
# Resources: expect at least 12–16 GB of RAM for Onyx alone (OpenSearch 2 GB heap + model servers).
# ============================================================================

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "6" }

x-onyx-env: &onyx-env
  FILE_STORE_BACKEND: "postgres"
  POSTGRES_HOST: "relational_db"
  OPENSEARCH_HOST: "opensearch"
  REDIS_HOST: "cache"
  MODEL_SERVER_HOST: "inference_model_server"
  INDEXING_MODEL_SERVER_HOST: "indexing_model_server"
  API_SERVER_PROTOCOL: "http"
  API_SERVER_HOST: "api_server"
  CODE_INTERPRETER_BASE_URL: ""
  ENABLE_CRAFT: "false"
  DISABLE_TELEMETRY: "true"
  TZ: "Europe/Berlin"

x-keycloak-host: &keycloak-host
  # Keycloak directly in the LAN (setup.sh, env/compose.env) – for SSO in the Onyx admin area; otherwise a harmless placeholder
  - "${KEYCLOAK_HOST:-keycloak.invalid}:${KEYCLOAK_IP:-127.0.0.1}"

services:

  api_server:
    <<: *hardening
    container_name: onyx-api
    image: onyxdotapp/onyx-backend:${ONYX_TAG:?set in env/versions.env}
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting Onyx Api Server\" &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    env_file:
      - /opt/onyx/env/onyx.env
    environment:
      <<: *onyx-env
    extra_hosts: *keycloak-host
    networks:
      backend: {}
      outbound: {}
      kira-llm: {}               # LLM via Bifrost (configure in the Onyx admin area)
    volumes:
      - api_server_logs:/var/log/onyx
      - file-system:/app/file-system
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 600s
    depends_on:
      relational_db:
        condition: service_healthy
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started

  background:
    <<: *hardening
    container_name: onyx-background
    image: onyxdotapp/onyx-backend:${ONYX_TAG:?set in env/versions.env}
    command: >
      /bin/sh -c "
      if [ -f /etc/ssl/certs/custom-ca.crt ]; then
        update-ca-certificates;
      fi &&
      /app/scripts/supervisord_entrypoint.sh"
    env_file:
      - /opt/onyx/env/onyx.env
    environment:
      <<: *onyx-env
    extra_hosts: *keycloak-host
    networks:
      backend: {}
      outbound: {}               # connectors (SharePoint/Microsoft Graph)
      kira-llm: {}
    volumes:
      - background_logs:/var/log/onyx
      - file-system:/app/file-system
    depends_on:
      relational_db:
        condition: service_healthy
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started
      indexing_model_server:
        condition: service_started

  web_server:
    <<: *hardening
    container_name: onyx-web
    image: onyxdotapp/onyx-web-server:${ONYX_TAG:?set in env/versions.env}
    env_file:
      - /opt/onyx/env/onyx.env
    environment:
      INTERNAL_URL: "http://api_server:8080"
      TZ: "Europe/Berlin"
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - api_server

  mcp_server:
    <<: *hardening
    container_name: onyx-mcp
    image: onyxdotapp/onyx-backend:${ONYX_TAG:?set in env/versions.env}
    command: ["python", "-m", "onyx.mcp_server_main"]
    env_file:
      - /opt/onyx/env/onyx.env
    environment:
      <<: *onyx-env
      MCP_SERVER_ENABLED: "true"
      MCP_SERVER_PORT: "8090"
    networks:
      backend: {}
      kira-onyx: {}              # only LibreChat talks to the MCP server
    volumes:
      - mcp_server_logs:/var/log/onyx
    depends_on:
      - relational_db
      - cache

  inference_model_server:
    <<: *hardening
    container_name: onyx-inference-model
    image: onyxdotapp/onyx-model-server:${ONYX_TAG:?set in env/versions.env}
    environment:
      LOG_LEVEL: "info"
    networks:
      backend: {}
      outbound: {}               # downloads the models from Hugging Face on first start
    volumes:
      - model_cache_huggingface:/app/.cache/huggingface/
      - inference_model_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 600s

  indexing_model_server:
    <<: *hardening
    container_name: onyx-indexing-model
    image: onyxdotapp/onyx-model-server:${ONYX_TAG:?set in env/versions.env}
    environment:
      INDEXING_ONLY: "True"
      LOG_LEVEL: "info"
    networks:
      backend: {}
      outbound: {}
    volumes:
      - indexing_huggingface_model_cache:/app/.cache/huggingface/
      - indexing_model_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 600s

  relational_db:
    <<: *hardening
    container_name: onyx-db
    image: postgres:${ONYX_POSTGRES_TAG:?set in env/versions.env}
    shm_size: 1g
    command: -c 'max_connections=250'
    env_file:
      - /opt/onyx/env/onyx.env           # POSTGRES_USER, POSTGRES_PASSWORD
    networks: [backend]
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *hardening
    container_name: onyx-opensearch
    image: opensearchproject/opensearch:${OPENSEARCH_TAG:?set in env/versions.env}
    env_file:
      - /opt/onyx/env/opensearch.env     # OPENSEARCH_INITIAL_ADMIN_PASSWORD (= OPENSEARCH_ADMIN_PASSWORD in onyx.env)
    environment:
      discovery.type: "single-node"
      # memory_lock off: memlock cannot be set in an unprivileged LXC
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g -XX:-UseBASE64Intrinsics"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [backend]
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  cache:
    <<: *hardening
    container_name: onyx-cache
    image: redis:${ONYX_REDIS_TAG:?set in env/versions.env}
    command: redis-server --save "" --appendonly no
    networks: [backend]
    tmpfs:
      - /data

  nginx:
    <<: *hardening
    container_name: onyx-nginx
    image: nginx:${ONYX_NGINX_TAG:?set in env/versions.env}
    environment:
      DOMAIN: "localhost"
      NGINX_PROXY_CONNECT_TIMEOUT: "300"
      NGINX_PROXY_SEND_TIMEOUT: "300"
      NGINX_PROXY_READ_TIMEOUT: "300"
      MCP_SERVER_ENABLED: "true"
    networks:
      backend: {}
      kira-proxy: {}             # Caddy -> onyx-nginx:80
    volumes:
      - /opt/onyx/nginx:/nginx-templates:ro   # templates unchanged from Onyx v5.1.3 (deployment/data/nginx, MIT licence)
    # as in the official package, but without the sed line-ending fix (setup.sh already strips CRLF)
    command:
      - /bin/sh
      - -c
      - >-
        rm -f /etc/nginx/conf.d/default.conf &&
        cp -a /nginx-templates/. /etc/nginx/conf.d/ &&
        cp /etc/nginx/conf.d/run-nginx.sh /tmp/run-nginx.sh &&
        chmod +x /tmp/run-nginx.sh &&
        exec /tmp/run-nginx.sh app.conf.template
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api_server:
        condition: service_healthy
      web_server:
        condition: service_healthy
      mcp_server:
        condition: service_started

networks:
  outbound:
    name: onyx-outbound
    ipam: { config: [{ subnet: 172.31.64.0/24 }] }   # source of the LAN block – do not change
  backend:
    internal: true
    ipam: { config: [{ subnet: 172.30.27.0/24 }] }
  kira-proxy:
    external: true
  kira-llm:
    external: true
  kira-onyx:
    external: true

volumes:
  db_volume:
  model_cache_huggingface:
  indexing_huggingface_model_cache:
  api_server_logs:
  background_logs:
  mcp_server_logs:
  inference_model_server_logs:
  indexing_model_server_logs:
  file-system:
  opensearch-data:
