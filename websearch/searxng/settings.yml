# ============================================================================
# SearXNG – web search for KIRA (internal only in the network kira-search, no port, no Caddy)
# After changes: docker restart searxng
# Secret: SEARXNG_SECRET from /opt/websearch/env/searxng.env (overrides server.secret_key)
# ============================================================================
use_default_settings:
  engines:
    # of no use for KIRA
    remove:
      - radio browser

general:
  instance_name: "KIRA-Suche"
  enable_metrics: false

server:
  limiter: false          # only LibreChat queries it – no bot protection/Valkey needed
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "de-DE"
  formats:                # json is required for LibreChat
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

# Search engines: Google, Bing and Brave are disabled in the SearXNG defaults – enabled here.
# LibreChat queries exactly these (searxngSearchOptions.engines in /opt/kira/config/librechat.yaml, generated by
# /opt/kira/scripts/librechat-config.py). A disabled or unknown search engine simply returns nothing.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
