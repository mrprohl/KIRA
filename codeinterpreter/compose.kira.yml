# ============================================================================
# KIRA settings for the code interpreter (ClickHouse/code-interpreter) – an override of its own
# docker-compose.yaml, used by setup-codeapi.sh:
#   docker compose -f src/docker-compose.yaml -f compose.kira.yml --env-file .env up -d --build
#
# What it changes against the developer defaults of the project:
#   - login only with KIRA's signed tokens (LOCAL_MODE=false, librechat-jwt, public key from .env)
#   - own secrets instead of "localdev"/"minioadmin" (generated into .env by setup-codeapi.sh)
#   - only the API is published (BIND_IP:API_PORT); Redis, MinIO, file server, sandbox and egress gateway stay internal
#   - KVM sandbox with hardening on (project default), restart after reboot
# Needs Docker Compose ≥ 2.24 (!override/!reset).
# ============================================================================
x-redis: &redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?generated by setup-codeapi.sh}
x-jwt: &jwt
  LOCAL_MODE: "false"
  CODEAPI_AUTH_PROVIDER: librechat-jwt
  CODEAPI_JWT_SINGLE_TENANT_ID: kira

services:
  api:
    restart: unless-stopped
    ports: !override
      - "${BIND_IP:-0.0.0.0}:${API_PORT:-3112}:3112"
    environment:
      <<: [*redis, *jwt]
      CODEAPI_JWT_ISSUER: librechat
      CODEAPI_JWT_AUDIENCE: codeapi
      CODEAPI_JWT_ALLOWED_ALGS: EdDSA
      CODEAPI_JWT_MAX_TTL_SECONDS: "300"
      CODEAPI_JWT_JWKS_JSON: ${CODEAPI_JWT_JWKS_JSON:?public key of KIRA – /opt/kira/config/codeapi-jwks.json}

  service-worker:
    restart: unless-stopped
    environment:
      <<: [*redis, *jwt]

  egress_gateway:
    restart: unless-stopped
    ports: !reset []
    environment:
      <<: *redis

  tool_call_server:
    restart: unless-stopped
    environment:
      <<: *redis

  sandbox-runner:
    restart: unless-stopped
    ports: !reset []
    environment:
      SANDBOX_LOG_LEVEL: INFO

  file_server:
    restart: unless-stopped
    ports: !reset []
    environment:
      <<: *redis
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?generated by setup-codeapi.sh}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?generated by setup-codeapi.sh}

  redis:
    restart: unless-stopped
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

  minio:
    restart: unless-stopped
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
