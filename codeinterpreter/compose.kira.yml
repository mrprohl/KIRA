# ============================================================================
# KIRA settings for the code interpreter (ClickHouse/code-interpreter, cloned by setup.sh into src/) – an override
# of its own docker-compose.yaml. Always use it through the wrapper:  bash /opt/codeinterpreter/codeapi.sh <command>
#
# What it changes against the developer defaults of the project:
#   - login only with KIRA's signed tokens (LOCAL_MODE=false, librechat-jwt, EdDSA, public key from env/codeapi.env)
#   - own secrets instead of "localdev"/"minioadmin" (generated into env/codeapi.env by setup.sh)
#   - no published ports and no internet: all services in an internal network; LibreChat reaches only the API
#     (container codeapi) over the internal network kira-code
#   - remote bridge (external sandbox VMs) off, KVM sandbox with hardening on (project default)
#   - container names codeapi-*, restart after reboot, log rotation
# Needs Docker Compose ≥ 2.24 (!override/!reset) and /dev/kvm.
# ============================================================================
x-redis: &redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?generated by setup.sh}
x-mode: &mode
  LOCAL_MODE: "false"
  CODEAPI_AUTH_PROVIDER: librechat-jwt
  CODEAPI_JWT_SINGLE_TENANT_ID: kira
  # no remote bridge: KIRA uses only the local KVM sandbox
  CODEAPI_BRIDGE_AUTH_MODE: static
  CODEAPI_BRIDGE_DYNAMIC_WORKERS: "false"
  CODEAPI_BRIDGE_TOKEN: ""
x-common: &common
  restart: unless-stopped
  ports: !reset []
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *common
    container_name: codeapi
    networks:
      default: {}
      kira-code: {}              # LibreChat -> http://codeapi:3112/v1
    environment:
      <<: [*redis, *mode]
      CODEAPI_JWT_ISSUER: librechat
      CODEAPI_JWT_AUDIENCE: codeapi
      CODEAPI_JWT_ALLOWED_ALGS: EdDSA
      CODEAPI_JWT_MAX_TTL_SECONDS: "300"
      CODEAPI_JWT_JWKS_JSON: ${CODEAPI_JWT_JWKS_JSON:?public key of KIRA – generated by setup.sh}

  service-worker:
    <<: *common
    container_name: codeapi-worker
    environment:
      <<: [*redis, *mode]
      PYTHON_CONCURRENCY: ${CODE_PARALLEL:-4}

  egress_gateway:
    <<: *common
    container_name: codeapi-egress
    environment:
      <<: *redis

  tool_call_server:
    <<: *common
    container_name: codeapi-toolcall
    environment:
      <<: *redis

  sandbox-runner:
    <<: *common
    container_name: codeapi-sandbox
    environment:
      SANDBOX_LOG_LEVEL: INFO
      SANDBOX_MAX_CONCURRENT_JOBS: ${CODE_PARALLEL:-4}

  file_server:
    <<: *common
    container_name: codeapi-files
    environment:
      <<: *redis
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?generated by setup.sh}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?generated by setup.sh}

  redis:
    <<: *common
    container_name: codeapi-redis
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

  minio:
    <<: *common
    container_name: codeapi-minio
    image: ${MINIO_IMAGE:-quay.io/minio/minio}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

networks:
  default:
    name: codeinterpreter_backend
    internal: true             # no internet, no LAN – the sandbox only talks to the egress gateway
    ipam: { config: [{ subnet: 172.30.30.0/24 }] }
  kira-code:
    external: true             # 172.30.29.0/24, created by /opt/kira/setup.sh
